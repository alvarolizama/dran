<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="url(#bg)"/>
  <!-- Connection lines (thick enough to survive downscale) -->
  <g stroke="#60a5fa" stroke-width="2.2" stroke-linecap="round" opacity="0.5" filter="url(#glow)">
    <line x1="32" y1="32" x2="16" y2="14"/>
    <line x1="32" y1="32" x2="52" y2="18"/>
    <line x1="32" y1="32" x2="50" y2="50"/>
    <line x1="32" y1="32" x2="14" y2="48"/>
    <line x1="32" y1="32" x2="52" y2="32"/>
    <line x1="32" y1="32" x2="12" y2="32"/>
  </g>
  <!-- Outer nodes (larger for visibility at small sizes) -->
  <g filter="url(#glow)">
    <circle cx="16" cy="14" r="5" fill="#60a5fa" opacity="0.95"/>
    <circle cx="52" cy="18" r="4.5" fill="#818cf8" opacity="0.9"/>
    <circle cx="50" cy="50" r="4.5" fill="#a78bfa" opacity="0.85"/>
    <circle cx="14" cy="48" r="5" fill="#60a5fa" opacity="0.9"/>
    <circle cx="52" cy="32" r="4" fill="#818cf8" opacity="0.8"/>
    <circle cx="12" cy="32" r="4" fill="#a78bfa" opacity="0.8"/>
  </g>
  <!-- Center node (main — larger, brighter) -->
  <g filter="url(#glow)">
    <circle cx="32" cy="32" r="10" fill="#3b82f6" opacity="0.2"/>
    <circle cx="32" cy="32" r="7" fill="#3b82f6"/>
    <circle cx="32" cy="32" r="4" fill="#93c5fd"/>
  </g>
</svg>
