<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Dran mark — colores del tema `dim` (paleta TokenGate, ver tokengate/priv/static/logo.svg).
     · primary           #9fe88d  (nodos)
     · success           #62efbd  (líneas y nodos secundarios)
     · primary 72 (hub)  #6fbb5c  (derivado)
     · primary 93 (core) #c9f7be  (derivado)
     Al cambiar el primary del tema, actualizar en el mismo commit:
     priv/static/favicon.svg, priv/static/favicon.ico y priv/static/logo.png. -->
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Transparent background (no fill) so the icon sits on any surface -->
  <!-- Connection lines (thick enough to survive downscale) -->
  <g stroke="#62efbd" stroke-width="2.2" stroke-linecap="round" opacity="0.5" filter="url(#glow)">
    <line x1="32" y1="32" x2="16" y2="14"/>
    <line x1="32" y1="32" x2="52" y2="18"/>
    <line x1="32" y1="32" x2="50" y2="50"/>
    <line x1="32" y1="32" x2="14" y2="48"/>
    <line x1="32" y1="32" x2="52" y2="32"/>
    <line x1="32" y1="32" x2="12" y2="32"/>
  </g>
  <!-- Outer nodes (larger for visibility at small sizes) -->
  <g filter="url(#glow)">
    <circle cx="16" cy="14" r="5" fill="#9fe88d" opacity="0.95"/>
    <circle cx="52" cy="18" r="4.5" fill="#62efbd" opacity="0.9"/>
    <circle cx="50" cy="50" r="4.5" fill="#6fbb5c" opacity="0.85"/>
    <circle cx="14" cy="48" r="5" fill="#9fe88d" opacity="0.9"/>
    <circle cx="52" cy="32" r="4" fill="#62efbd" opacity="0.8"/>
    <circle cx="12" cy="32" r="4" fill="#6fbb5c" opacity="0.8"/>
  </g>
  <!-- Center node (main — larger, brighter) -->
  <g filter="url(#glow)">
    <circle cx="32" cy="32" r="10" fill="#9fe88d" opacity="0.2"/>
    <circle cx="32" cy="32" r="7" fill="#6fbb5c"/>
    <circle cx="32" cy="32" r="4" fill="#c9f7be"/>
  </g>
</svg>