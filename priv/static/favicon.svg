<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Dran mark — marca de la familia (mismos colores que TokenGate/Skema).
     · gradiente     #9fe88d → #62efbd   (trazos: radiales y hub)
     · primary       #9fe88d             (nodos)
     · success       #62efbd             (nodos secundarios)
     · primary-72    #6fbb5c             (derivado, nodos)
     · primary-93    #c9f7be             (core)
     Al cambiar la paleta de marca, actualizar en el mismo commit:
     priv/static/favicon.svg, priv/static/favicon.ico y priv/static/logo.png. -->
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="dran-mark" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9fe88d"/>
      <stop offset="1" stop-color="#62efbd"/>
    </linearGradient>
  </defs>
  <!-- Transparent background (no fill) so the icon sits on any surface -->
  <!-- Connection lines (thick enough to survive downscale) -->
  <g stroke="url(#dran-mark)" stroke-width="2.2" stroke-linecap="round" opacity="0.5" filter="url(#glow)">
    <line x1="32" y1="32" x2="16" y2="14"/>
    <line x1="32" y1="32" x2="52" y2="18"/>
    <line x1="32" y1="32" x2="50" y2="50"/>
    <line x1="32" y1="32" x2="14" y2="48"/>
    <line x1="32" y1="32" x2="52" y2="32"/>
    <line x1="32" y1="32" x2="12" y2="32"/>
  </g>
  <!-- Outer nodes (larger for visibility at small sizes) -->
  <g filter="url(#glow)">
    <circle cx="16" cy="14" r="5" fill="#9fe88d" opacity="0.95"/>
    <circle cx="52" cy="18" r="4.5" fill="#62efbd" opacity="0.9"/>
    <circle cx="50" cy="50" r="4.5" fill="#6fbb5c" opacity="0.85"/>
    <circle cx="14" cy="48" r="5" fill="#9fe88d" opacity="0.9"/>
    <circle cx="52" cy="32" r="4" fill="#62efbd" opacity="0.8"/>
    <circle cx="12" cy="32" r="4" fill="#6fbb5c" opacity="0.8"/>
  </g>
  <!-- Center node (main — larger, brighter; hub con el gradiente de marca) -->
  <g filter="url(#glow)">
    <circle cx="32" cy="32" r="10" fill="#9fe88d" opacity="0.2"/>
    <circle cx="32" cy="32" r="7" fill="url(#dran-mark)"/>
    <circle cx="32" cy="32" r="4" fill="#c9f7be"/>
  </g>
</svg>
