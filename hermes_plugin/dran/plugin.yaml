name: dran
version: 1.5.0
description: "Dran — shared multi-agent memory store + knowledge tools backed by your Dran instance (REST, per-account API token attribution, X-Hermes-Agent identity)."
author: Álvaro Lizama
license: MIT
kind: standalone
# ── One plugin, one config file, two surfaces ───────────────────────────────
# There is no desktop plugin and no second install: the two surfaces live in
# THIS directory and read/write the SAME $HERMES_HOME/dran/config.json.
#
#   * runtime  — __init__.py. The MemoryProvider (get_tool_schemas) and the
#                agent tools registered from register(ctx); `hooks` and
#                `provides_tools` below are its manifest surface. Headless by
#                construction: files + DRAN_API_KEY, no UI of its own.
#   * panel    — config_schema.py. Hermes reads it from disk next to this file
#                (plugins/memory/__init__.py::find_provider_dir →
#                get_provider_config_schema) and renders it as the memory
#                provider's config panel — Desktop → Settings → Memory &
#                Context (below the `memory.provider` field) and `hermes
#                memory setup`. It WRITES the same flat JSON the runtime reads.
#
# The panel is addressed by PROVIDER NAME, which is why it cannot live in a
# separate plugin: it belongs to the provider it configures. Because the panel
# request carries the profile (?profile=<name>), it configures whichever
# profile the app is pointed at, remote profiles included — no extra plugin
# and no extra code for that.
hooks:
  - on_session_end
# Tool names this plugin registers from register(ctx). Listed so the plugins
# hub can show what it provides (and surface `requires_env` hints); the
# schemas themselves live in __init__.py and are the source of truth.
#
# They register into SEVEN Hermes toolsets — `dran_pages`, `dran_goals`,
# `dran_tasks`, `dran_plans`, `dran_services`, `dran_skills`, `dran_brain` —
# NOT into a single `dran` (v1.5: the all-or-nothing switch was the whole
# point of splitting). Toolsets are derived by Hermes from `entry.toolset`
# (`hermes_cli/plugins.py::get_plugin_toolsets`), so nothing declares them
# here; the group table (`_TOOL_GROUPS` in __init__.py) is the source of
# truth and each group also has a bool in the config panel.
# ONLY register()-registered tools belong here: the memory tools
# (dran_memory_search/add/update/feedback) come from the provider's
# get_tool_schemas(), not from register(), so they are deliberately absent —
# `hermes plugins validate` fails on a registered-but-undeclared tool and
# warns on a declared-but-unregistered one.
provides_tools:
  - dran_search
  - dran_list_pages
  - dran_list_page_types
  - dran_get_page
  - dran_create_page
  - dran_update_page
  - dran_delete_page
  - dran_rename_slug
  - dran_reaugment_page
  - dran_get_links
  - dran_create_relation
  - dran_delete_relation
  - dran_start_worker
  - dran_get_worker_session
  - dran_generate_cluster_summaries
  - dran_lint_brain
  - dran_stats
  # Goals, tasks y planes (contrato de superficies, W2): el contenedor de trabajo,
  # la captura rápida y el checklist. Cada uno es un cliente delgado del REST
  # (/api/goals, /api/tasks, /api/plans, /api/capture, /api/checklist/toggle).
  # `dran_list_groups` es el descubrimiento del destino: los grupos del dueño de
  # la credencial ([{slug, name}]), para elegir uno por NOMBRE.
  - dran_list_groups
  - dran_list_goals
  - dran_get_goal
  - dran_create_goal
  - dran_update_goal
  - dran_delete_goal
  - dran_list_tasks
  - dran_create_task
  - dran_get_task
  - dran_move_task
  - dran_update_task
  - dran_delete_task
  - dran_capture
  - dran_list_plans
  - dran_get_plan
  - dran_create_plan
  - dran_update_plan
  - dran_set_plan_checklist
  - dran_toggle_checklist
  - dran_delete_plan
  # Servicios conectados (cliente delgado del REST /api/services): listar el
  # estado, emitir el link de conexión, DESCUBRIR el catálogo, ejecutar una
  # tool y esperar a ACTIVE. El catálogo viaja como DATO — una tool de
  # descubrimiento (`dran_services_tools`), NUNCA una tool por toolkit; por eso
  # no hay `dran_gmail_*` ni equivalentes.
  - dran_services
  - dran_services_connect
  - dran_services_tools
  - dran_services_run
  - dran_services_wait
  # Skills remotos (contrato de skills remotos, W4): 4 tools FIJAS y el
  # catálogo como DATO — el plugin registra estático al cargarse, así que una
  # tool por skill sería una lista que el servidor no puede cambiar sin
  # reiniciar el perfil. El cuerpo viaja por tool y NUNCA se baja a disco
  # (`dran_skill` es la única puerta del cuerpo; el índice no lo trae).
  - dran_skills
  - dran_skill
  - dran_skill_save
  - dran_skill_delete
# Credential for BOTH surfaces — one token, one attribution: the account token
# (Dran → Settings → Account → API token). The runtime reads it from the
# profile .env; the panel's `api_key` field resolves to it.
requires_env:
  - name: DRAN_API_KEY
    description: "Dran account token (Dran → Settings → Account → API token) — one credential per account (W3, users.api_token). Shared by the memory provider and the knowledge tools: same token, same attribution; no per-agent key is created."
    prompt: "Dran account token (dran_…)"
# ── La TARJETA del plugin: toda la configuración que no es de memoria ────────
# Declared here (not in config_schema.py) so the plugins hub gives the row a
# settings gear (plugins_tab: "only plugins with a page in Settings ▸ Plugins
# (config_schema or a registered page) get one") — the surface where the plugin
# is ALSO turned on/off. Values land under `plugins.entries.dran.settings` of
# the profile (config.yaml); the `secret` field goes to the profile .env
# instead, through the credential route, never into config.yaml.
#
# Keys are FLAT on purpose (``pages``, not ``tools.pages``): `plugins_settings.py`
# writes dotted keys NESTED but re-reads them with a flat ``current.get(key)``,
# so a dotted key would render its schema default over the stored value.
#
# Precedence, per key (same rule the tools and the provider share):
#   defaults ← esta tarjeta ← `$HERMES_HOME/dran/config.json` (gana, legacy).
# The JSON is what the memory provider's panel writes; it keeps winning so a
# hand-edited or pre-existing config file never changes meaning under the user.
config_schema:
  api_key:
    type: secret
    env: DRAN_API_KEY
    label: API key
    description: "Dran account token (Dran → Settings → Account → API token). One credential per account: the same token backs the memory provider and every tool. Stored in the profile .env, never in config.yaml."
  base_url:
    type: str
    default: "http://localhost:4000"
    label: Base URL
    description: "Dran instance URL."
  scope:
    type: str
    choices: ["private", "public", "group"]
    default: "private"
    label: Write scope
    description: "Default destination of this profile's writes: private (only your account), public (everyone on the instance) or group (only the members of Group slug). An empty or unknown slug fails closed (422), never private in silence."
  scope_group:
    type: str
    default: ""
    label: Group slug
    description: "Slug of the group this profile's writes go to when Write scope is 'group'. `GET /api/groups` (or the agent tool dran_list_groups) lists your groups; the slug is the group's stable, copyable id."
  memory:
    type: bool
    default: true
    label: Memory (recall & capture)
    description: "The plugin's memory half: recall at turn start, transcript capture at session end, and the four dran_memory_* tools. Off, Hermes does not even load the provider — the memory tools leave the listing and `memory.provider: dran` has nothing to run (the panel under Memory & Context keeps its recall knobs, they just have no effect)."
  pages:
    type: bool
    default: true
    label: Pages & relations
    description: "Search, list, read, create, update, delete and relink knowledge pages (dran_search, dran_*_page, dran_rename_slug, dran_reaugment_page, dran_*_relation, dran_get_links). Hermes toolset: dran_pages."
  goals:
    type: bool
    default: true
    label: Goals
    description: "The container of work: list, read, create, update and delete goals, plus dran_list_groups (the destination slugs a goal or plan write can target). Hermes toolset: dran_goals."
  tasks:
    type: bool
    default: true
    label: Tasks & capture
    description: "List, read, create, update, move and delete tasks, plus dran_capture (quick capture: a task into the inbox goal). Hermes toolset: dran_tasks."
  plans:
    type: bool
    default: true
    label: Plans & checklists
    description: "List, read, create, update and delete plans, and tick their checklist (dran_set_plan_checklist, dran_toggle_checklist). Hermes toolset: dran_plans."
  services:
    type: bool
    default: true
    label: Connected services
    description: "Inspect the connected services, emit a connect link, DISCOVER a toolkit's tool catalog and run one of its tools (dran_services*). The catalog travels as data — never one tool per toolkit. Hermes toolset: dran_services."
  skills:
    type: bool
    default: true
    label: Remote skills
    description: "List the workspace's skills, load one body by slug, and save or delete one (dran_skills, dran_skill, dran_skill_save, dran_skill_delete). Hermes toolset: dran_skills."
  brain:
    type: bool
    default: true
    label: Brain & workers
    description: "The agent-side brain: start an autonomous worker session and read it back, regenerate cluster summaries, audit the workspace's structure and read the dashboard numbers (dran_start_worker, dran_get_worker_session, dran_generate_cluster_summaries, dran_lint_brain, dran_stats). Hermes toolset: dran_brain."