name: dran
version: 1.3.0
description: "Dran — shared multi-agent memory store + knowledge tools backed by your Dran instance (REST, per-account API token attribution, X-Hermes-Agent identity)."
author: Álvaro Lizama
license: MIT
kind: standalone
# ── One plugin, two halves, ONE config file (contract W9 / A10) ──────────────
# The plugin ships the SAME source as two halves over a single source of truth:
#   * runtime — the headless half. Configured by FILES only (no UI, no state
#               of its own): $HERMES_HOME/dran/config.json plus the profile
#               .env's DRAN_API_KEY. The top-level hooks/provides_tools below
#               are its surface; it reads that file and needs neither the panel
#               nor a second config to run.
#   * panel   — the desktop half (config_schema.py, rendered by the dashboard's
#               Memory → Dran page). It WRITES that same flat JSON and can also
#               apply it to a REMOTE headless profile (via that host's CLI and
#               files). It is a VIEW over the runtime's config, never a second
#               source: no second config file, no second credential.
halves:
  runtime:
    label: Headless runtime
    configured_by: files      # $HERMES_HOME/dran/config.json + profile .env
    config_file: "$HERMES_HOME/dran/config.json"
    credential_env: DRAN_API_KEY
    ui: false
    own_state: none
  panel:
    label: Desktop panel
    kind: declarative-config-ui  # config_schema.py, loaded by path
    schema: config_schema.py
    writes_config_file: "$HERMES_HOME/dran/config.json"
    applies_to_remote_headless: true
    ui: true
hooks:
  - on_session_end
# Tool names this plugin registers from register(ctx). Listed so the plugins
# hub can show what it provides (and surface `requires_env` hints); the
# schemas themselves live in __init__.py and are the source of truth.
provides_tools:
  - dran_search
  - dran_list_pages
  - dran_get_page
  - dran_create_page
  - dran_update_page
  - dran_delete_page
  - dran_rename_slug
  - dran_reaugment_page
  - dran_get_links
  - dran_create_relation
  - dran_delete_relation
  - dran_start_worker
  - dran_get_worker_session
  - dran_generate_cluster_summaries
  - dran_lint_brain
  - dran_stats
  - dran_memory_search
  - dran_memory_add
  - dran_memory_update
  - dran_memory_feedback
# Config surface of the DESKTOP PANEL — the declarative config_schema.py the
# dashboard's Memory → Dran page renders (and `hermes memory setup` mirrors).
# It is loaded by path from the web server, so it stays out of this manifest;
# it writes the SAME $HERMES_HOME/dran/config.json the runtime reads, and
# `api_key` resolves from DRAN_API_KEY (the profile .env) — one credential.
requires_env:
  - name: DRAN_API_KEY
    description: "Dran account token (Dran → Settings → Account → API token) — one credential per account (W3, users.api_token). Shared by the memory provider and the knowledge tools: same token, same attribution; no per-agent key is created."
    prompt: "Dran account token (dran_…)"
